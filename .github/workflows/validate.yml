name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contract (PowerShell)
        shell: pwsh
        run: ./eng/validate-repository.ps1
      - name: Independently validate repository contract (Python)
        run: python eng/validate.py
